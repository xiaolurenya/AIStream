name: Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p app assembleDebug --no-daemon

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/*.apk AIStream-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIStream-APK
          path: AIStream-debug.apk
